<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- referrer no-referrer:发起 cross-origin 资源请求(米家头像 CDN 等)时
         不暴露住户 LAN IP+端口给三方。document-level 比逐个标签 referrerPolicy 保险。
         robots noindex,nofollow:住户路由器穿透到公网时不被搜索引擎索引家庭面板。 -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 中文字体走系统通用栈（MiSans → 苹方 → 雅黑 → 系统 sans），不再硬依赖小米 CDN。
         数字 / 英文 / IID 用 Geist Mono——自托管 woff2，见 src/styles/theme.css 的 @font-face。 -->
    <link rel="preload" href="/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <title>我的家</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
